syntax = "proto3";

package gnss;

option java_package = "goodvin.locsync.proto";
option java_outer_classname = "LocationProto";

message ServerResponse {
    Status status = 1;
    int32 satellites = 2;
    optional LocationUpdate location_update = 3;
    optional PhoneState phone = 4;   // the phone's battery and heat, so the head unit can warn
}

message PhoneState {
    optional int32 battery_percent = 1;   // 0-100; absent when the phone doesn't report it
    bool charging = 2;
    optional float battery_temp_c = 3;
    int32 thermal_status = 4;        // PowerManager.THERMAL_STATUS_* (Android 10+), 0 = none/unknown
}

enum Status {
    UNINITIALIZED = 0;
    AWAITING_LOCATION = 1;
    TRANSMITTING_LOCATION = 2;
    LOCATION_STOPPED = 3;
}

message LocationUpdate {
  int64 timestamp = 1;           // Unix timestamp in milliseconds
  double latitude = 2;
  double longitude = 3;
  double altitude = 4;
  float accuracy = 5;            // Horizontal accuracy in meters
  optional float vertical_accuracy = 8;  // meters, from Location.getVerticalAccuracyMeters() (API 26+)
  optional float bearing = 6;    // Degrees from north; absent when the provider reports no bearing
  optional float speed = 7;      // m/s; absent when the provider reports no speed (e.g. GPS lost in a tunnel)
  string provider = 9;           // "gps", "network", "fused", etc.
  float location_age = 10;       // Seconds since fix
  optional float speed_accuracy = 11;    // m/s, from Fused Location.getSpeedAccuracyMetersPerSecond()
  optional float bearing_accuracy = 12;  // degrees, from Fused Location.getBearingAccuracyDegrees()
  optional double msl_altitude = 13;          // meters above mean sea level, from Location.getMslAltitudeMeters() (API 34+)
  optional float msl_altitude_accuracy = 14;  // meters, from Location.getMslAltitudeAccuracyMeters() (API 34+)
}
